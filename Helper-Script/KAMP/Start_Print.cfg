###########################################
# Additional Macros for Creality K1 Series
###########################################

[respond]

[virtual_pins]

[output_pin ADAPTIVE_BED_MESH]
pin: virtual_pin:ADAPTIVE_BED_MESH_pin
value: 1

[output_pin FULL_BED_MESH]
pin: virtual_pin:FULL_BED_MESH_pin
value: 0

[output_pin ADAPTIVE_PURGE_LINE]
pin: virtual_pin:ADAPTIVE_PURGE_LINE_pin
value: 1


[gcode_macro _ADAPTIVE_BED_MESH_ON]
description: Enable Adaptive Bed Mesh and Disable Full Bed Mesh
gcode:
  SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=1
  SET_PIN PIN=FULL_BED_MESH VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _FULL_BED_MESH_ON]
description: Disable Adaptive Bed Mesh and Enable Full Bed Mesh
gcode:
  SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=0
  SET_PIN PIN=FULL_BED_MESH VALUE=1
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _BED_MESH_OFF]
description: Disable Adaptive Bed Mesh and Full Bed Mesh
gcode:
  SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=0
  SET_PIN PIN=FULL_BED_MESH VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _ADAPTIVE_PURGE_LINE_ON]
description: Enable Adaptive Purge Line
gcode:
  SET_PIN PIN=ADAPTIVE_PURGE_LINE VALUE=1
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _ADAPTIVE_PURGE_LINE_OFF]
description: Disable Adaptive Purge Line
gcode:
  SET_PIN PIN=ADAPTIVE_PURGE_LINE VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro KAMP_BED_MESH_SETTINGS]
description: Configure Bed Mesh type
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Bed Mesh Settings"
  RESPOND TYPE=command MSG="action:prompt_text What type of bed mesh do you want to use when you start printing?"
  RESPOND TYPE=command MSG="action:prompt_button ADAPTIVE BED MESH|_ADAPTIVE_BED_MESH_ON|primary"
  RESPOND TYPE=command MSG="action:prompt_button FULL BED MESH|_FULL_BED_MESH_ON|primary"
  RESPOND TYPE=command MSG="action:prompt_button NONE|_BED_MESH_OFF|primary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro KAMP_PURGE_LINE_SETTINGS]
description: Configure Purge Line type
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Purge Line Settings"
  RESPOND TYPE=command MSG="action:prompt_text What type of purge line do you want to use when you start printing?"
  RESPOND TYPE=command MSG="action:prompt_button ADAPTIVE PURGE LINE|_ADAPTIVE_PURGE_LINE_ON|primary"
  RESPOND TYPE=command MSG="action:prompt_button CLASSIC PURGE LINE|_ADAPTIVE_PURGE_LINE_OFF|primary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  WAIT_TEMP_END
  CLEAR_PAUSE

  {% set g28_extruder_temp = 180.0 %}
  {% set bed_temp = printer.custom_macro.default_bed_temp|float %}
  {% set extruder_temp = printer.custom_macro.default_extruder_temp|float %}
  {% set tool = params.TOOL|default(-1)|int %}

  {% if 'BED_TEMP' in params|upper and (params.BED_TEMP|float) %}
    {% set bed_temp = params.BED_TEMP|float %}
  {% endif %}

  {% if 'EXTRUDER_TEMP' in params|upper and (params.EXTRUDER_TEMP|float) %}
    {% set extruder_temp = params.EXTRUDER_TEMP|float %}
  {% endif %}

  RESPOND TYPE=command MSG="DEBUG: START_PRINT loaded - CFS-aware bed-first version"
  RESPOND TYPE=command MSG="DEBUG: requested bed={bed_temp}, final nozzle={extruder_temp}, probe nozzle={g28_extruder_temp}, tool={tool}"

  # Initialize Creality CFS/box system before the slicer/firmware tries tool selection.
  RESPOND TYPE=command MSG="DEBUG: before BOX_START_PRINT"
  BOX_START_PRINT
  RESPOND TYPE=command MSG="DEBUG: after BOX_START_PRINT"

  # Heat bed to slicer bed temp before homing, cleaning, and mesh.
  M140 S{bed_temp}

  # Keep nozzle at safer probing/cleaning temp.
  M104 S{g28_extruder_temp}

  RESPOND TYPE=command MSG="DEBUG: waiting for bed to reach slicer temp"
  M190 S{bed_temp}

  RESPOND TYPE=command MSG="DEBUG: waiting for nozzle to reach probing temp"
  M109 S{g28_extruder_temp}

  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    PRINT_PREPARE_CLEAR

    RESPOND TYPE=command MSG="DEBUG: before G28"
    G28
    RESPOND TYPE=command MSG="DEBUG: after G28"

    RESPOND TYPE=command MSG="DEBUG: before NOZZLE_CLEAR"
    NOZZLE_CLEAR HOT_MIN_TEMP={g28_extruder_temp} HOT_MAX_TEMP={extruder_temp} BED_MAX_TEMP={bed_temp}
    RESPOND TYPE=command MSG="DEBUG: after NOZZLE_CLEAR"

    # Lift off the silicone cleaning pad before waiting for nozzle temp to drop.
    G90
    G1 Z10 F600

    RESPOND TYPE=command MSG="DEBUG: reasserting temps after NOZZLE_CLEAR"
    M140 S{bed_temp}
    M104 S{g28_extruder_temp}
    M190 S{bed_temp}
    M109 S{g28_extruder_temp}

    RESPOND TYPE=command MSG="DEBUG: before ACCURATE_G28"
    ACCURATE_G28
    RESPOND TYPE=command MSG="DEBUG: after ACCURATE_G28"

    RESPOND TYPE=command MSG="DEBUG: reasserting bed temp after ACCURATE_G28"
    M140 S{bed_temp}
    M190 S{bed_temp}

    {% if printer['output_pin ADAPTIVE_BED_MESH'].value == 1 %}
      RESPOND TYPE=command MSG="DEBUG: starting adaptive bed mesh at slicer bed temp"
      BED_MESH_CLEAR
      BED_MESH_CALIBRATE
      BED_MESH_PROFILE SAVE=adaptive
      BED_MESH_PROFILE LOAD=adaptive
    {% else %}
      {% if printer['output_pin FULL_BED_MESH'].value == 0 and (not printer['bed_mesh'].profile_name) %}
        RESPOND TYPE=command MSG="DEBUG: no bed mesh found, starting full bed mesh"
        CX_PRINT_LEVELING_CALIBRATION
      {% endif %}
      {% if printer['output_pin FULL_BED_MESH'].value == 1 %}
        RESPOND TYPE=command MSG="DEBUG: starting full bed mesh"
        CX_PRINT_LEVELING_CALIBRATION
      {% endif %}
      BED_MESH_PROFILE LOAD=default
    {% endif %}

  {% else %}
    PRINT_PREPARE_CLEAR
  {% endif %}

  # Heat nozzle to final slicer print temp before CFS tool selection/load.
  RESPOND TYPE=command MSG="DEBUG: heating nozzle to final print temp before CFS tool load"
  M104 S{extruder_temp}
  M109 S{extruder_temp}
  M190 S{bed_temp}

  # Preload/select requested CFS tool inside START_PRINT.
  # Example: TOOL=2 becomes T2, meaning CFS slot 3.
  {% if tool >= 0 %}
    RESPOND TYPE=command MSG="DEBUG: before CFS tool select T{tool}"
    T{tool}
    RESPOND TYPE=command MSG="DEBUG: after CFS tool select T{tool}"
  {% else %}
    RESPOND TYPE=command MSG="DEBUG: no TOOL parameter passed to START_PRINT; skipping CFS tool preload"
  {% endif %}

  # Reassert final temps after CFS load/tool selection.
  M104 S{extruder_temp}
  M109 S{extruder_temp}
  M190 S{bed_temp}

  {% if printer['output_pin ADAPTIVE_PURGE_LINE'].value == 1 %}
    _SMART_PARK
    RESPOND TYPE=command MSG="DEBUG: starting adaptive purge line"
    _LINE_PURGE
  {% else %}
    RESPOND TYPE=command MSG="DEBUG: starting classic purge line"
    CX_PRINT_DRAW_ONE_LINE
  {% endif %}

  SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}